# E2E 三端一致性 — tag / nightly 触发（ADR-0030 Decision 7：不进每 commit）
# 编排 mirror contract-test ci.yml：sibling checkout 4 被测仓 → 起 dev server → healthcheck → playwright。
# 凭据走 secret：E2E_TEST_PASSWORD（msw 家族 DEMO_PASSWORD，公开值，仍走 secret 便于轮换）。
name: e2e
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "23 14 * * *" # 每日 22:23 +0800（off-minute，避开整点洪峰）
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 4 个被测仓作为 sibling checkout（起服约定见 docs/conventions/e2e-runtime.md）。
      # 不用 actions/checkout：v4 拒绝 workspace 外路径（run 34707765007/34629627282
      # 失败根因，lab-e2e 同病同修 a01db77），git clone 到 ../ 与本机 dev 布局逐字一致。
      - name: Checkout siblings (msw/react/vue/nextjs)
        run: |
          for repo in msw react vue nextjs; do
            git clone --depth 1 "https://github.com/zcqiand/saas-identity-platform-$repo.git" "../saas-identity-platform-$repo"
          done

      - name: Install all
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          for repo in msw react vue nextjs; do
            (cd ../saas-identity-platform-$repo && (npm ci --no-audit --no-fund || npm install --no-audit --no-fund))
          done

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      # CI 无 .env.local（gitignored）——按各仓 .env.example 契约生成，API base 全指 msw :5100
      - name: Write env files
        run: |
          # msw：server.ts 用 dotenv/config 读 .env（JWT_* fail-fast，缺了 login 即炸）
          cp ../saas-identity-platform-msw/.env.example ../saas-identity-platform-msw/.env
          for repo in react vue; do
            printf 'VITE_API_BASE_URL=http://localhost:5100\nVITE_LOGIN_CLIENT_ID=saas-console\n' \
              > ../saas-identity-platform-$repo/.env.local
          done
          printf 'NEXT_PUBLIC_API_BASE_URL=http://localhost:5100\nNEXT_PUBLIC_SAAS_BASE_URL=http://localhost:5100\nNEXT_PUBLIC_LOGIN_CLIENT_ID=saas-console\n' \
            > ../saas-identity-platform-nextjs/.env.local
          cp .env.test .env.local
          echo "E2E_TEST_PASSWORD=${{ secrets.E2E_TEST_PASSWORD }}" >> .env.local

      - name: Start 4 servers
        run: |
          mkdir -p .runtime-logs
          PIDS=()
          (cd ../saas-identity-platform-msw && nohup npm run dev > "$OLDPWD/.runtime-logs/msw.log" 2>&1) & PIDS+=($!)
          (cd ../saas-identity-platform-nextjs && nohup npm run dev > "$OLDPWD/.runtime-logs/nextjs.log" 2>&1) & PIDS+=($!)
          (cd ../saas-identity-platform-react && nohup npm run dev > "$OLDPWD/.runtime-logs/react.log" 2>&1) & PIDS+=($!)
          (cd ../saas-identity-platform-vue && nohup npm run dev > "$OLDPWD/.runtime-logs/vue.log" 2>&1) & PIDS+=($!)

          healthcheck() {
            for i in $(seq 1 90); do
              code=$(curl -s -o /dev/null -w "%{http_code}" "$2" || true)
              [ "$code" = "200" ] && echo "$1 up" && return 0
              sleep 2
            done
            echo "$1 FAILED"; tail -40 .runtime-logs/*.log; return 1
          }
          healthcheck msw    http://localhost:5100/healthz
          healthcheck nextjs http://localhost:5101/login
          healthcheck react  http://localhost:5102/login
          healthcheck vue    http://localhost:5103/login

      - name: Run e2e
        run: npm run e2e

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            .state/trace.json
          retention-days: 7
